name: Deploy and Restart

on:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Create config.py from the example
        run: cp config.example.py config.py

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Import the bot and its extensions
        run: uv run python -c "import main, ext.cmd, ext.health"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Restarting the bot
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ./LalaBot
            git pull --ff-only
            ~/.local/bin/uv sync --no-dev
            sudo systemctl restart lalabot.service
