[project]
name = "lalabot"
version = "0.1.0"
description = "🤖 Discord bot to control my bots' systemd services from Discord"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "discord-py>=2.6.4",
]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D",
    "F401",
    "F402",
    "F403",
    "F405",
    "PERF203",
    "RUF001",
    "RUF009",
    "SIM105",
    "UP034",
    "ANN401",
    "UP032",
    "COM812",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.110",
]


[tool.ruff.lint.isort]
split-on-trailing-comma = true
