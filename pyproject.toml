[project]
name = "lalabot"
version = "0.1.0"
description = "Discord bot that watches over AluBot and IreBot and pings the owner when they go down"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["discord-py>=2.6.4"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D",
    "F401",
    "F402",
    "F403",
    "F405",
    "PERF203",
    "RUF001",
    "RUF009",
    "SIM105",
    "UP034",
    "ANN401",
    "UP032",
    "COM812",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"


[tool.ruff.lint.isort]
split-on-trailing-comma = true
