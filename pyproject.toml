[project]
name = "lalabot"
version = "0.1.0"
description = "🤖 Discord bot to control my bots' systemd services from Discord"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.4",
    "discord-py>=2.6.4",
]

[tool.ruff]
line-length = 125
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D",
    "F401",
    "F402",
    "F403",
    "F405",
    "PERF203",
    "RUF001",
    "RUF009",
    "SIM105",
    "UP034",
    "ANN401",
    "UP032",
    "COM812",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]


[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ty.environment]
# LalaBot only runs on the VPS, so check against Linux even on a Windows machine (e.g. `os.getloadavg` exists).
python-platform = "linux"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "INP001",  # tests/ is a folder of test files, not a package
    "PLR2004", # magic values are the point of test expectations
    "S101",    # pytest uses plain asserts
]
